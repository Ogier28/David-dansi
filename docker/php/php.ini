; Réglages PHP de production. Chargé après php.ini-production par le préfixe zz-.

expose_php = Off
memory_limit = 256M
max_execution_time = 60
post_max_size = 8M
upload_max_filesize = 8M

; Les erreurs partent dans les logs du conteneur, jamais dans la réponse HTTP.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr

date.timezone = UTC

; OPcache : les fichiers ne changent pas pendant la vie du conteneur.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.save_comments = 1
realpath_cache_size = 4096K
realpath_cache_ttl = 600
