; Pool PHP-FPM du conteneur. Nginx parle à PHP en TCP sur la boucle locale.

[www]
user = www-data
group = www-data

listen = 127.0.0.1:9000

; Processus dynamiques : adapté à une petite instance Render.
pm = dynamic
pm.max_children = 12
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.max_requests = 500

; Les logs d'erreur PHP sortent sur la sortie standard du conteneur
; pour être lisibles dans le tableau de bord Render.
catch_workers_output = yes
decorate_workers_output = no
php_admin_value[error_log] = /dev/stderr
php_admin_flag[log_errors] = on

clear_env = no
