; Supervisor fait tourner Nginx et PHP-FPM dans le même conteneur et arrête
; tout le conteneur si l'un des deux meurt (Render relance alors le service).

[supervisord]
nodaemon = true
user = root
logfile = /dev/null
logfile_maxbytes = 0
pidfile = /run/supervisord.pid

[program:php-fpm]
command = php-fpm --nodaemonize --force-stderr
autostart = true
autorestart = true
startretries = 3
priority = 10
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

[program:nginx]
command = nginx -g "daemon off;"
autostart = true
autorestart = true
startretries = 3
priority = 20
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

[eventlistener:shutdown]
command = sh -c "printf 'READY\n'; while read -r line; do kill -SIGQUIT $PPID; done < /dev/stdin"
events = PROCESS_STATE_FATAL
